[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ml-mobileclip"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ftfy>=6.3.1",
    "huggingface-hub>=0.24.0",
    "onnxruntime>=1.24.4",
    "onnxscript>=0.6.2",
    "pillow>=12.2.0",
    "regex>=2026.4.4",
    "safetensors>=0.4.0",
    "sentencepiece>=0.2.1",
    "timm>=1.0.26",
    "torch>=2.11.0",
    "torchvision>=0.26.0",
    "tqdm>=4.67.3",
    "transformers>=5.7.0",
]

[tool.setuptools.packages.find]
where = [".", "third_party/open_clip/src"]
include = ["mobileclip*", "open_clip*", "open_clip_train*"]
namespaces = false

[tool.setuptools.package-data]
open_clip = ["bpe_simple_vocab_16e6.txt.gz", "model_configs/*.json"]
